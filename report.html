<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PashuRakshak — Report symptom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
  {% include "_nav.html" %}

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Report a symptom</h1>
        <p style="margin:0">A few details help us flag risk faster — this takes under a minute.</p>
      </div>
    </div>

    <form id="report-form" class="card" style="max-width:640px;">
      <div class="field">
        <label>Animal type</label>
        <div class="chip-group" data-name="animal_type">
          <div class="chip" data-value="cattle">Cattle</div>
          <div class="chip" data-value="buffalo">Buffalo</div>
          <div class="chip" data-value="goat">Goat / Sheep</div>
          <div class="chip" data-value="poultry">Poultry</div>
        </div>
      </div>

      <div class="field">
        <label>Number of animals affected</label>
        <input type="number" name="affected_count" min="1" value="1">
      </div>

      <div class="field">
        <label>Symptoms observed</label>
        <div class="chip-group" data-name="symptoms">
          <div class="chip" data-value="fever">Fever</div>
          <div class="chip" data-value="lesions">Mouth/foot lesions</div>
          <div class="chip" data-value="loss_appetite">Loss of appetite</div>
          <div class="chip" data-value="lameness">Lameness</div>
          <div class="chip" data-value="diarrhea">Diarrhoea</div>
          <div class="chip" data-value="milk_drop">Sudden milk drop</div>
          <div class="chip" data-value="swelling">Swelling / nodules</div>
          <div class="chip" data-value="death">Sudden death</div>
        </div>
      </div>

      <div class="field">
        <label>Days since symptoms started</label>
        <input type="number" name="days_since_onset" min="0" value="1">
      </div>

      <div class="field">
        <label>Photo (optional)</label>
        <input type="file" name="photo" accept="image/*" capture="environment">
      </div>

      <div class="field">
        <label>Additional notes</label>
        <textarea name="notes" placeholder="Anything else the vet should know"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit report</button>
    </form>

    <div id="result" class="card-outline" style="max-width:640px; margin-top:18px; display:none;">
      <h3>Triage result</h3>
      <div id="result-body"></div>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
