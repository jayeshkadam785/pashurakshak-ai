<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PashuRakshak — Vaccination</title>
<style>
body{margin:0;background:#07110c;color:#eef8f0;font-family:system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:28px}
.card{margin-top:18px;padding:22px;border:1px solid #294332;border-radius:18px;background:#0d1b12}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{color:#b8cabc;font-size:13px}
input,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border-radius:9px;border:1px solid #36513f;background:#09150d;color:#fff}
button{padding:12px 16px;margin-top:14px;border:0;border-radius:9px;background:#2ca86b;color:#fff;font-weight:800}
.row{padding:12px 0;border-bottom:1px solid #26392b}
</style>
</head>
<body data-protected="true">
<div class="wrap">
<h1>💉 Vaccination Tracking</h1>

<div class="card">
<form id="form">
<div class="grid">
<label>Species<input name="species" placeholder="Cattle" required></label>
<label>Animal ID<input name="animal_id" placeholder="TAG-001"></label>
<label>Vaccine<input name="vaccine_name" placeholder="FMD" required></label>
<label>Vaccination date<input name="vaccination_date" type="date" required></label>
<label>Next due date<input name="next_due_date" type="date"></label>
<label>Batch number<input name="batch_number"></label>
<label>Administered by<input name="administered_by"></label>
</div>
<label>Notes<textarea name="notes"></textarea></label>
<button>Save Vaccination</button>
</form>
</div>

<div class="card">
<h2>Recent records</h2>
<div id="list">Loading...</div>
</div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/features.js"></script>
<script>
async function load(){
 try{
  const d=await PashuFeatures.vaccinations();
  document.getElementById("list").innerHTML=(d.records||[]).map(x=>
   `<div class="row"><b>${x.vaccine_name||"Vaccine"}</b> — ${x.species||"Animal"} — ${x.vaccination_date||"—"} → next: ${x.next_due_date||"—"}</div>`
  ).join("") || "No records yet.";
 }catch(e){document.getElementById("list").textContent=e.message}
}

document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();
 try{
  const payload=Object.fromEntries(new FormData(e.target).entries());
  await PashuFeatures.addVaccination(payload);
  alert("Vaccination saved");
  e.target.reset();
  load();
 }catch(e){alert(e.message)}
};

load();
</script>
</body>
</html>
