<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PashuRakshak AI — Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#07110c;
  color:#eef8f0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.card{
  width:min(440px,92vw);
  padding:30px;
  border-radius:22px;
  background:#0d1b12;
  border:1px solid #294332;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  font-size:42px;
  text-align:center;
  margin-bottom:10px;
}

h1{
  margin:0;
  text-align:center;
}

.sub{
  color:#9db1a3;
  text-align:center;
  margin:8px 0 25px;
}

label{
  display:block;
  margin:13px 0 6px;
  color:#b8cabc;
  font-size:14px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #36513f;
  background:#0a160e;
  color:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:#2ca86b;
}

button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#2ca86b;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.signup{
  background:#183b26;
}

#msg{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#14281a;
  color:#bde8c8;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body
  data-supabase-url="{{ supabase_url }}"
  data-supabase-key="{{ supabase_key }}"
>

<div class="card">

  <div class="logo">🐄</div>

  <h1>PashuRakshak AI</h1>

  <div class="sub">
    Secure Livestock Health Platform
  </div>

  <label for="email">Email</label>

  <input
    id="email"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
  >

  <label for="password">Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <label for="role">Select Role</label>

  <select id="role">
    <option value="farmer">👨‍🌾 Farmer</option>
    <option value="vet">🩺 Veterinarian</option>
    <option value="officer">🏛️ Government Officer</option>
    <option value="admin">🔐 Admin</option>
  </select>

  <button id="login">
    Sign In
  </button>

  <button id="signup" class="signup">
    Create Account
  </button>

  <div id="msg"></div>

</div>

<script src="/static/auth.js"></script>

<script>
const msg = document.getElementById("msg");
const loginBtn = document.getElementById("login");
const signupBtn = document.getElementById("signup");

function showMessage(text){
  msg.textContent = text;
  msg.style.display = "block";
}

function getRole(){
  return document.getElementById("role").value;
}

function getRoute(role){
  const routes = {
    farmer: "/dashboard/farmer",
    vet: "/vet/cases",
    officer: "/dashboard/official",
    admin: "/dashboard/official"
  };

  return routes[role] || "/dashboard/farmer";
}

/*
 * Handle Supabase email-confirmation callback.
 * After clicking the confirmation link, Supabase may return
 * the user to this page with a session in the browser.
 */
async function handleAuthCallback(){

  try{

    if(!window.PashuAuth || !PashuAuth.client){
      return;
    }

    const session = await PashuAuth.session();

    if(session && session.user){

      const savedRole =
        localStorage.getItem("pashu_role") || "farmer";

      /*
       * Only redirect automatically when the URL contains
       * Supabase authentication callback parameters.
       */
      const hash = window.location.hash || "";
      const search = window.location.search || "";

      if(
        hash.includes("access_token") ||
        hash.includes("refresh_token") ||
        search.includes("code=")
      ){

        showMessage("Email confirmed successfully. Opening dashboard...");

        setTimeout(function(){
          window.location.href = getRoute(savedRole);
        }, 700);

      }

    }

  }catch(error){

    console.error("Auth callback error:", error);

  }

}


/* LOGIN */

loginBtn.onclick = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const role =
    getRole();

  if(!email || !password){

    showMessage("Please enter email and password.");
    return;

  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";

  try{

    const result =
      await PashuAuth.login(email,password);

    if(result.error){
      throw result.error;
    }

    if(!result.data || !result.data.session){

      throw new Error(
        "Login requires email confirmation. Please confirm your email first."
      );

    }

    PashuAuth.setRole(role);

    showMessage("Login successful. Opening dashboard...");

    setTimeout(function(){

      window.location.href =
        getRoute(role);

    },500);

  }catch(error){

    console.error("Login error:",error);

    showMessage(
      error.message ||
      "Login failed. Please check your email and password."
    );

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";

  }

};


/* SIGN UP */

signupBtn.onclick = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const role =
    getRole();

  if(!email || !password){

    showMessage(
      "Please enter email and password."
    );

    return;

  }

  if(password.length < 6){

    showMessage(
      "Password must contain at least 6 characters."
    );

    return;

  }

  signupBtn.disabled = true;
  signupBtn.textContent = "Creating account...";

  try{

    const result =
      await PashuAuth.signup(
        email,
        password,
        role
      );

    if(result.error){
      throw result.error;
    }

    PashuAuth.setRole(role);

    /*
     * Supabase returns a user but no session when
     * email confirmation is required.
     */
    if(result.data && result.data.session){

      showMessage(
        "Account created successfully. Opening dashboard..."
      );

      setTimeout(function(){

        window.location.href =
          getRoute(role);

      },700);

    }else{

      showMessage(
        "Account created successfully. " +
        "Please check your email and click the confirmation link. " +
        "After confirmation, return here and sign in."
      );

    }

  }catch(error){

    console.error("Signup error:",error);

    showMessage(
      error.message ||
      "Account creation failed."
    );

  }finally{

    signupBtn.disabled = false;
    signupBtn.textContent = "Create Account";

  }

};


/* CHECK EMAIL CONFIRMATION CALLBACK */

document.addEventListener(
  "DOMContentLoaded",
  handleAuthCallback
);

</script>

</body>
</html>
