```html
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PashuRakshak AI — Vet Cases</title>

<style>
body{
  margin:0;
  background:#07110c;
  color:#eef8f0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.card{
  margin-top:20px;
  padding:20px;
  border:1px solid #294332;
  border-radius:18px;
  background:#0d1b12;
}

.case{
  padding:16px;
  margin:12px 0;
  border:1px solid #294332;
  border-radius:14px;
  background:#0a1710;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border-radius:9px;
  background:#09150d;
  color:#fff;
  border:1px solid #36513f;
  margin-top:8px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  background:#2ca86b;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.logout{
  background:#7b2929;
}

.muted{
  color:#9db1a3;
}

.risk-high{
  color:#ff7777;
  font-weight:800;
}

.risk-moderate{
  color:#ffc65c;
  font-weight:800;
}

.risk-low{
  color:#6ee7a0;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:30px;
  color:#9db1a3;
}

.loading{
  text-align:center;
  padding:30px;
  color:#9db1a3;
}

.error-box{
  border:1px solid #7b2929;
  background:#24100f;
  color:#ffb0a8;
  padding:18px;
  border-radius:12px;
}

.status-badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#183b28;
  color:#8ff0b5;
  font-size:.8rem;
  font-weight:800;
}

.header-info{
  margin-top:8px;
  font-size:.85rem;
  color:#769080;
}
</style>
</head>

<!--
  IMPORTANT:
  Only the Supabase publishable key is exposed to the browser.
  NEVER put SUPABASE_KEY / sb_secret key here.
-->
<body
  data-protected="true"
  data-supabase-url="{{ supabase_url }}"
  data-supabase-key="{{ supabase_publishable_key }}"
>

<div class="wrap">

  <div class="top">

    <div>
      <h1>🩺 Vet Case Verification</h1>

      <div class="muted">
        Review → Verify → Treat → Close
      </div>

      <div class="header-info">
        PashuRakshak AI · Veterinary Response Center
      </div>
    </div>

    <button
      class="logout"
      data-logout
      type="button"
    >
      Logout
    </button>

  </div>

  <div
    id="cases"
    class="card"
  >
    <div class="loading">
      🔄 Checking authentication and loading cases...
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/static/auth.js"></script>
<script src="/static/features.js"></script>

<script>

let reports = [];
let pageReady = false;


/* ============================================================
   HTML ESCAPE
   ============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   RISK CLASS
   ============================================================ */

function riskClass(level){

  const value =
    String(level || "")
      .toLowerCase();

  if(value === "high"){
    return "risk-high";
  }

  if(value === "moderate"){
    return "risk-moderate";
  }

  return "risk-low";

}


/* ============================================================
   SYMPTOMS
   ============================================================ */

function symptomsText(symptoms){

  if(Array.isArray(symptoms)){

    if(!symptoms.length){
      return "No symptoms recorded";
    }

    return symptoms
      .map(function(x){
        return escapeHtml(x);
      })
      .join(", ");

  }

  return escapeHtml(
    symptoms || "No symptoms recorded"
  );

}


/* ============================================================
   AUTH CHECK
   ============================================================ */

async function ensureAuthenticated(){

  try{

    if(!window.PashuAuth){

      throw new Error(
        "Authentication system failed to load."
      );

    }

    const session =
      await window.PashuAuth.session();

    if(!session){

      window.location.href = "/login";
      return false;

    }

    return true;

  }catch(error){

    console.error(
      "Authentication check failed:",
      error
    );

    window.location.href = "/login";
    return false;

  }

}


/* ============================================================
   LOAD CASES
   ============================================================ */

async function loadCases(){

  const box =
    document.getElementById("cases");

  box.innerHTML = `
    <div class="loading">
      🔄 Loading veterinary cases...
    </div>
  `;

  try{

    const authenticated =
      await ensureAuthenticated();

    if(!authenticated){
      return;
    }


    const response =
      await window.PashuAuth.authFetch(
        "/api/reports"
      );


    /*
      If the backend rejects the token, do not silently
      continue as an unauthenticated page.
    */
    if(response.status === 401 ||
       response.status === 403){

      box.innerHTML = `
        <div class="error-box">
          ❌ Your login session has expired.
          <br><br>
          Please login again.
        </div>
      `;

      setTimeout(function(){
        window.location.href = "/login";
      },1500);

      return;

    }


    if(!response.ok){

      throw new Error(
        "Unable to load veterinary cases. HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(data.success === false){

      throw new Error(
        data.error ||
        "Unable to load cases."
      );

    }


    reports =
      Array.isArray(data.reports)
        ? data.reports
        : [];


    pageReady = true;

    renderCases();


  }catch(error){

    console.error(
      "Load cases failed:",
      error
    );

    box.innerHTML = `
      <div class="error-box">
        ❌ ${escapeHtml(
          error.message ||
          "Failed to load cases."
        )}
        <br><br>
        <button
          type="button"
          onclick="loadCases()"
        >
          🔄 Retry
        </button>
      </div>
    `;

  }

}


/* ============================================================
   RENDER CASES
   ============================================================ */

function renderCases(){

  const box =
    document.getElementById("cases");


  if(!reports.length){

    box.innerHTML = `
      <div class="empty">

        <h3>📋 No livestock cases found</h3>

        <p>
          New farmer reports will appear here
          for veterinary verification.
        </p>

      </div>
    `;

    return;

  }


  box.innerHTML =
    reports.map(function(caseData){

      const rawId =
        caseData.id || "";

      const id =
        escapeHtml(rawId);


      const level =
        String(
          caseData.risk_level || "LOW"
        ).toUpperCase();


      const currentStatus =
        String(
          caseData.case_status ||
          caseData.status ||
          "UNDER_REVIEW"
        ).toUpperCase();


      return `

      <div class="case">

        <div class="grid">

          <div>
            <b>Case ID</b><br>
            ${id || "—"}
          </div>


          <div>
            <b>Village</b><br>
            ${escapeHtml(
              caseData.village || "—"
            )}
          </div>


          <div>
            <b>Block</b><br>
            ${escapeHtml(
              caseData.block || "—"
            )}
          </div>


          <div>
            <b>Animal</b><br>
            ${escapeHtml(
              caseData.animal_type || "—"
            )}
          </div>


          <div>
            <b>Risk</b><br>

            <span class="${riskClass(level)}">

              ${level}

              (${escapeHtml(
                caseData.risk_score ?? 0
              )})

            </span>

          </div>


          <div>
            <b>Affected</b><br>

            ${escapeHtml(
              caseData.affected_count ?? 0
            )}

          </div>


          <div>
            <b>Current Status</b><br>

            <span class="status-badge">
              ${escapeHtml(currentStatus)}
            </span>

          </div>

        </div>


        <p class="muted">

          <b>Symptoms:</b>

          ${symptomsText(
            caseData.symptoms
          )}

        </p>


        <label>

          <b>Update Status</b>

        </label>


        <select
          id="status-${id}"
        >

          <option
            value="UNDER_REVIEW"
            ${currentStatus === "UNDER_REVIEW" ? "selected" : ""}
          >
            UNDER REVIEW
          </option>


          <option
            value="VERIFIED"
            ${currentStatus === "VERIFIED" ? "selected" : ""}
          >
            VERIFIED
          </option>


          <option
            value="ISOLATED"
            ${currentStatus === "ISOLATED" ? "selected" : ""}
          >
            ISOLATED
          </option>


          <option
            value="TREATMENT"
            ${currentStatus === "TREATMENT" ? "selected" : ""}
          >
            TREATMENT
          </option>


          <option
            value="CLOSED"
            ${currentStatus === "CLOSED" ? "selected" : ""}
          >
            CLOSED
          </option>


          <option
            value="REJECTED"
            ${currentStatus === "REJECTED" ? "selected" : ""}
          >
            REJECTED
          </option>

        </select>


        <textarea
          id="note-${id}"
          placeholder="Enter vet notes, diagnosis, treatment or isolation instructions..."
        ></textarea>


        <button
          type="button"
          onclick="updateCase('${id}')"
        >
          ✅ Update Case
        </button>

      </div>

      `;

    }).join("");

}


/* ============================================================
   UPDATE CASE
   ============================================================ */

async function updateCase(id){

  try{

    const statusElement =
      document.getElementById(
        "status-" + id
      );


    const noteElement =
      document.getElementById(
        "note-" + id
      );


    if(!statusElement ||
       !noteElement){

      throw new Error(
        "Case form could not be loaded."
      );

    }


    const status =
      statusElement.value;


    const note =
      noteElement.value.trim();


    if(!window.PashuFeatures){

      throw new Error(
        "Feature API is not available."
      );

    }


    await window.PashuFeatures.verifyCase(
      id,
      {
        case_status: status,
        vet_notes: note
      }
    );


    alert(
      "✅ Case updated successfully"
    );


    await loadCases();


  }catch(error){

    console.error(
      "Case update failed:",
      error
    );

    alert(
      "❌ " +
      (
        error.message ||
        "Failed to update case."
      )
    );

  }

}


/* ============================================================
   START
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadCases();

  }
);

</script>

</body>
</html>
```
