<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PashuRakshak AI — Vet Cases</title>

<style>
body{
  margin:0;
  background:#07110c;
  color:#eef8f0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.card{
  margin-top:20px;
  padding:20px;
  border:1px solid #294332;
  border-radius:18px;
  background:#0d1b12;
}

.case{
  padding:16px;
  margin:12px 0;
  border:1px solid #294332;
  border-radius:14px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border-radius:9px;
  background:#09150d;
  color:#fff;
  border:1px solid #36513f;
  margin-top:8px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  background:#2ca86b;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  opacity:.9;
}

.logout{
  background:#7b2929;
}

.muted{
  color:#9db1a3;
}

.risk-high{
  color:#ff7777;
  font-weight:800;
}

.risk-moderate{
  color:#ffc65c;
  font-weight:800;
}

.risk-low{
  color:#6ee7a0;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:30px;
  color:#9db1a3;
}
</style>
</head>


<body data-protected="true">

<div class="wrap">

  <div class="top">

    <div>
      <h1>🩺 Vet Case Verification</h1>

      <div class="muted">
        Review → Verify → Treat → Close
      </div>
    </div>

    <button
      class="logout"
      data-logout
    >
      Logout
    </button>

  </div>


  <div
    id="cases"
    class="card"
  >
    Loading cases...
  </div>

</div>


<script src="/static/auth.js"></script>
<script src="/static/features.js"></script>


<script>

let reports = [];


async function loadCases(){

  const box =
    document.getElementById("cases");

  box.innerHTML =
    "Loading cases...";


  try{

    const response =
      await PashuAuth.authFetch(
        "/api/reports"
      );


    if(!response.ok){

      throw new Error(
        "Unable to load cases."
      );

    }


    const data =
      await response.json();


    reports =
      data.reports || [];


    renderCases();


  }catch(error){

    box.innerHTML = `
      <div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function riskClass(level){

  const value =
    String(level || "")
      .toLowerCase();

  if(value === "high")
    return "risk-high";

  if(value === "moderate")
    return "risk-moderate";

  return "risk-low";

}


function symptomsText(symptoms){

  if(Array.isArray(symptoms)){

    return symptoms
      .map(x => escapeHtml(x))
      .join(", ");

  }

  return escapeHtml(
    symptoms || "No symptoms recorded"
  );

}


function renderCases(){

  const box =
    document.getElementById("cases");


  if(!reports.length){

    box.innerHTML = `
      <div class="empty">
        <h3>No livestock cases found</h3>
        <p>
          New farmer reports will appear here.
        </p>
      </div>
    `;

    return;

  }


  box.innerHTML =
    reports.map(caseData => {

      const id =
        escapeHtml(caseData.id || "");

      const level =
        String(
          caseData.risk_level || "LOW"
        ).toUpperCase();


      return `

      <div class="case">

        <div class="grid">

          <div>
            <b>Case ID</b><br>
            ${id || "—"}
          </div>

          <div>
            <b>Village</b><br>
            ${escapeHtml(
              caseData.village || "—"
            )}
          </div>

          <div>
            <b>Animal</b><br>
            ${escapeHtml(
              caseData.animal_type || "—"
            )}
          </div>

          <div>
            <b>Risk</b><br>
            <span class="${riskClass(level)}">
              ${level}
              (${escapeHtml(
                caseData.risk_score ?? 0
              )})
            </span>
          </div>

          <div>
            <b>Affected</b><br>
            ${escapeHtml(
              caseData.affected_count ?? 0
            )}
          </div>

          <div>
            <b>Status</b><br>
            ${escapeHtml(
              caseData.case_status ||
              "UNDER_REVIEW"
            )}
          </div>

        </div>


        <p class="muted">
          <b>Symptoms:</b>
          ${symptomsText(
            caseData.symptoms
          )}
        </p>


        <label>
          <b>Update Status</b>
        </label>

        <select id="status-${id}">

          <option value="UNDER_REVIEW">
            UNDER REVIEW
          </option>

          <option value="VERIFIED">
            VERIFIED
          </option>

          <option value="ISOLATED">
            ISOLATED
          </option>

          <option value="TREATMENT">
            TREATMENT
          </option>

          <option value="CLOSED">
            CLOSED
          </option>

          <option value="REJECTED">
            REJECTED
          </option>

        </select>


        <textarea
          id="note-${id}"
          placeholder="Enter vet notes, diagnosis, treatment or isolation instructions..."
        ></textarea>


        <button
          onclick="updateCase('${id}')"
        >
          Update Case
        </button>

      </div>

      `;

    }).join("");

}


async function updateCase(id){

  try{

    const statusElement =
      document.getElementById(
        "status-" + id
      );

    const noteElement =
      document.getElementById(
        "note-" + id
      );


    const status =
      statusElement.value;

    const note =
      noteElement.value.trim();


    await PashuFeatures.verifyCase(
      id,
      {
        case_status: status,
        vet_notes: note
      }
    );


    alert(
      "✅ Case updated successfully"
    );


    await loadCases();


  }catch(error){

    alert(
      "❌ " +
      (error.message ||
       "Failed to update case.")
    );

  }

}


loadCases();

</script>

</body>
</html>
